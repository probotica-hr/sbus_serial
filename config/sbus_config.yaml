/**/sbus_node:
    ros__parameters:
        port: "/dev/ttyUSB0"
        refresh_rate_hz: 20
        rxMinValue: 192
        rxMaxValue: 1792
        outMinValue: -100
        outMaxValue: 100
        silentOnFailsafe: true
        enableChannelNum: -1
        enableChannelProportionalMin: 1.0
        enableChannelProportionalMax: 1.0
        deadband: 100

/**/sbus_commands:
    ros__parameters:
        refresh_rate_hz: 20
        timeoutThreshold: 0.25 # in s

        forwardChannelIndx: 1
        turnChannelIndx: 3
        lateralChannelIndx: 0
        sbusMinValue: -100
        sbusMaxValue: 100
        turboChannelIndx: 4
        turboChannelValue: 0.0

        minSpeed: -1.0
        maxSpeed: 1.0
        minTurn: -0.4
        maxTurn: 0.4
        minLateral: -1.0
        maxLateral: 1.0

        minTurboSpeed: -3.0
        maxTurboSpeed: 3.0
        minTurboTurn: -1.0
        maxTurboTurn: 1.0
        minTurboLateral: -3.0
        maxTurboLateral: 3.0

        enableControlChannelIndex: 7
        enableControlChannelValue: 100.0

        modeChannelIndex: 5
        modeChannelThresholdLow: -50.0
        modeChannelThresholdHigh: 50.0

        enableUtilCommands: false
        batteryChannelIndex: 5
        batteryChannelValue: -100.0
        batteryChannelToggle: false
        lightChannelIndex: 8
        lightChannelValue: 100.0
        lightChannelToggle: false
        hornChannelIndex: 6
        hornChannelValue: 100.0
        hornChannelToggle: true

        # Winch mode (hold-to-run via Trigger services, see winch_hold_to_run.hpp).
        # winchModeIndex: mode value (0/1/2) that is winch mode, -1 = disabled.
        # In winch mode the twist is forced to zero and the stick on
        # winchChannelIndx drives the winch: full one way = wind, full the other
        # way = unwind, anything else = stop. Each service is called once per change.
        winchModeIndex: -1
        winchChannelIndx: 1
        winchChannelThreshold: 90.0
        winchInvert: false
        winchWindService: "/winch/winch/wind"
        winchUnwindService: "/winch/winch/unwind"
        winchStopService: "/winch/winch/stop"
        winchStopRetryPeriod: 0.5
        winchServiceTimeout: 2.0
        # Dry run: no service is called, the service that WOULD be called is
        # published on winch_mock (std_msgs/String). Set false to arm the real winch.
        winchMock: false

        reverseTurn: false
        useStamped: true
        frameId: ""
        deadband: 0.0
